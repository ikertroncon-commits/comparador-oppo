name: Prueba lectura de precios
on:
  push:
    branches: [pruebas-precios]
    paths: ['herramientas/prueba_webs.py', '.github/workflows/prueba-precios.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prueba:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 herramientas/prueba_webs.py
      - name: Guardar resultado
        run: |
          git config user.name "ikertroncon-commits"; git config user.email "ikertroncon-commits@users.noreply.github.com"
          git add herramientas/ && git commit -m "Resultado de la prueba de precios" && git push || true
